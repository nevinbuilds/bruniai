            text-align: center;
            color: #333;
        }
        .image-panel img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #ddd;
        }
        @media (max-width: 1200px) {
            .comparison-grid {
                grid-template-columns: 1fr;

        }
